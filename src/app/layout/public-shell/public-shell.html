<app-site-header [links]="headerLinks" />

<main>
  <router-outlet />
</main>

<footer class="public-footer">
  <div class="public-footer__grid">
    <div class="public-footer__col">
      <h3 class="public-footer__heading">Contacto</h3>
      <a class="public-footer__line" href="tel:4425316">
        <span class="material-icons" aria-hidden="true">call</span>
        4425316
      </a>
      <a class="public-footer__line" href="https://wa.me/5493644456464" target="_blank" rel="noopener">
        <span class="material-icons" aria-hidden="true">chat</span>
        3644564646
      </a>
    </div>

    <div class="public-footer__col">
      <h3 class="public-footer__heading">Ubicación</h3>
      <p class="public-footer__line public-footer__line--stack">
        <span class="public-footer__address-row">
          <span class="material-icons" aria-hidden="true">place</span>
          <span>San Martín 1171</span>
        </span>
        <span class="public-footer__address-row public-footer__address-row--secondary">
          Calle 12 e 23 y 25
        </span>
      </p>
    </div>

    <div class="public-footer__col public-footer__col--brand">
      <div class="public-footer__brand">
        <img class="public-footer__logo" src="/logo.jpeg" alt="Ovando Vende" />
        <div>
          <p class="public-footer__brand-title">Inmobiliaria Ovando</p>
          <p class="public-footer__brand-tagline">Tu próxima propiedad, más cerca de vos</p>
        </div>
      </div>
      <p class="public-footer__copy">© {{ currentYear }} Inmobiliaria Ovando.</p>

  </div>
