<section class="property-list">
  <header class="property-list__header">
    <div>
      <h1 class="property-list__title">Propiedades</h1>
      @if (properties.hasValue()) {
        <p class="property-list__count">{{ properties.value().totalElements }} en total</p>
      }
    </div>

    <button matButton="filled" color="primary" (click)="onNewProperty()">
      <mat-icon>add</mat-icon>
      Nueva propiedad
    </button>
  </header>

  @if (properties.isLoading()) {
    <div class="property-list__status">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  }

  @if (properties.error()) {
    <p class="property-list__status property-list__status--error" role="alert">
      No pudimos cargar las propiedades. Probá recargar la página.
    </p>
  }

  @if (properties.hasValue()) {
    <mat-tab-group class="property-list__tabs">
      <mat-tab [label]="'Disponibles (' + availableProperties().length + ')'">
        <app-property-table
          [properties]="availableProperties()"
          emptyMessage="No hay propiedades disponibles."
          (edit)="onEditProperty($event)"
          (statusChange)="onStatusChange($event)"
        />
      </mat-tab>

      <mat-tab [label]="'Alquiladas (' + rentedProperties().length + ')'">
        <app-property-table
          [properties]="rentedProperties()"
          emptyMessage="Todavía no hay propiedades alquiladas."
          (edit)="onEditProperty($event)"
          (statusChange)="onStatusChange($event)"
        />
      </mat-tab>

      <mat-tab [label]="'Vendidas (' + selledProperties().length + ')'">
        <app-property-table
          [properties]="selledProperties()"
          emptyMessage="Todavía no hay propiedades vendidas."
          (edit)="onEditProperty($event)"
          (statusChange)="onStatusChange($event)"
        />
      </mat-tab>
    </mat-tab-group>
  }
</section>
